services:
  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    container_name: nginx
    ports:
     - "80:80"
    networks:
     - notes-app
    depends_on:
     - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notes-app
    ports:
     - "5000:5000"
    networks:
     - notes-app
    env_file:
     - "./backend/.env"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql
    ports:
     - "3306:3306"
    environment:
     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
     -  notes-app
    volumes:
     -  sql-data:/var/lib/mysql
     - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
networks:
  notes-app:
volumes:
  sql-data:
