<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Task Manager</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #e5e7eb;
      background: linear-gradient(135deg, #111827, #172554);
      padding: 35px 16px;
    }

    main {
      max-width: 720px;
      margin: auto;
    }

    header { margin-bottom: 28px; }

    .tag {
      color: #60a5fa;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 2px;
    }

    h1 { font-size: clamp(28px, 6vw, 42px); margin: 12px 0; }
    header p { color: #9ca3af; line-height: 1.6; }

    .panel {
      padding: 24px;
      border: 1px solid #374151;
      border-radius: 18px;
      background: #111827cc;
      box-shadow: 0 20px 60px #0003;
    }

    form { display: flex; gap: 10px; }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #4b5563;
      border-radius: 10px;
      color: white;
      background: #1f2937;
      font-size: 15px;
    }

    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .add { background: #60a5fa; color: #111827; }
    .delete { background: #7f1d1d; color: #fecaca; }
    .complete { background: #14532d; color: #bbf7d0; }

    .summary {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #9ca3af;
      margin: 24px 0 12px;
      font-size: 14px;
    }

    ul { padding: 0; list-style: none; }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #374151;
    }

    .task-title { overflow-wrap: anywhere; }
    .done { text-decoration: line-through; color: #9ca3af; }
    .buttons { display: flex; gap: 8px; }
    .empty { color: #9ca3af; text-align: center; padding: 24px 0; }
    #notice { min-height: 20px; color: #fbbf24; font-size: 14px; }

    @media (max-width: 480px) {
      .panel { padding: 16px; }
      form { flex-direction: column; }
      li { align-items: flex-start; flex-direction: column; }
      .buttons { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="tag">Docker learning project</div>
      <h1>DevOps Task Manager</h1>
      <p>Add your tasks, track progress and practise container persistence.</p>
    </header>

    <section class="panel">
      <form id="taskForm">
        <input id="taskInput" placeholder="What needs to be done?" maxlength="200" required>
        <button class="add" type="submit">+ Add task</button>
      </form>

      <p id="notice" role="status"></p>

      <div class="summary">
        <span id="total">0 tasks</span>
        <span id="progress">0 completed</span>
      </div>

      <ul id="taskList"></ul>
    </section>
  </main>

  <script>
    const form = document.getElementById("taskForm");
    const input = document.getElementById("taskInput");
    const list = document.getElementById("taskList");
    const notice = document.getElementById("notice");

    async function request(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...options.headers
        }
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.error || "Request failed");
      }

      return result;
    }

    async function loadTasks() {
      try {
        const tasks = await request("/api/tasks");
        list.replaceChildren();

        document.getElementById("total").textContent =
          `${tasks.length} task${tasks.length === 1 ? "" : "s"}`;

        document.getElementById("progress").textContent =
          `${tasks.filter(task => task.completed).length} completed`;

        if (tasks.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty";
          empty.textContent = "No tasks yet. Add your first task!";
          list.appendChild(empty);
          return;
        }

        tasks.forEach(task => {
          const item = document.createElement("li");
          const title = document.createElement("span");
          title.className = "task-title" + (task.completed ? " done" : "");
          title.textContent = task.title;

          const buttons = document.createElement("div");
          buttons.className = "buttons";

          const toggle = document.createElement("button");
          toggle.className = "complete";
          toggle.textContent = task.completed ? "Undo" : "Done";
          toggle.onclick = async () => {
            try {
              await request(`/api/tasks/${encodeURIComponent(task.id)}`, {
                method: "PATCH"
              });
              await loadTasks();
            } catch (error) {
              notice.textContent = error.message;
            }
          };

          const remove = document.createElement("button");
          remove.className = "delete";
          remove.textContent = "Delete";
          remove.onclick = async () => {
            try {
              await request(`/api/tasks/${encodeURIComponent(task.id)}`, {
                method: "DELETE"
              });
              await loadTasks();
            } catch (error) {
              notice.textContent = error.message;
            }
          };

          buttons.append(toggle, remove);
          item.append(title, buttons);
          list.appendChild(item);
        });
      } catch (error) {
        notice.textContent = "Could not load tasks: " + error.message;
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      notice.textContent = "";

      try {
        await request("/api/tasks", {
          method: "POST",
          body: JSON.stringify({ title: input.value })
        });

        input.value = "";
        await loadTasks();
      } catch (error) {
        notice.textContent = error.message;
      }
    });

    loadTasks();
  </script>
</body>
</html>
